<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Astra Tarot</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #08030f;
      --card: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 215, 130, 0.35);
      --gold: #f4c76b;
      --violet: #9b5cff;
      --text: #f7efff;
      --muted: #c7b8dd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(155, 92, 255, 0.35), transparent 35%),
        radial-gradient(circle at bottom, rgba(244, 199, 107, 0.16), transparent 30%),
        var(--bg);
      padding: 22px 16px 32px;
    }

    .app {
      max-width: 520px;
      margin: 0 auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 22px;
    }

    .star {
      width: 76px;
      height: 76px;
      margin: 0 auto 12px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, #fff6c7, #f4c76b 35%, rgba(155, 92, 255, 0.25) 70%);
      box-shadow: 0 0 34px rgba(244, 199, 107, 0.65);
      font-size: 36px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      border: 1px solid var(--card-border);
      background: var(--card);
      color: var(--text);
      border-radius: 18px;
      padding: 16px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    button strong {
      display: block;
      color: var(--gold);
      font-size: 17px;
      margin-bottom: 4px;
    }

    button span {
      display: block;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .note {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      text-align: center;
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="hero">
      <div class="star">✦</div>
      <h1>Astra Tarot</h1>
      <p class="subtitle">
        Выберите расклад. Звезда-проводник поможет мягко взглянуть на ситуацию через символы Таро.
      </p>
    </section>

    <section class="list">
      <button data-spread="daily_card">
        <strong>Карта дня</strong>
        <span>Короткий символический совет на сегодня.</span>
      </button>

      <button data-spread="quick">
        <strong>Быстрый расклад</strong>
        <span>Для ситуации, где хочется быстро понять общий вектор.</span>
      </button>

      <button data-spread="love">
        <strong>Сердечный расклад</strong>
        <span>Про чувства, отношения и внутренние переживания.</span>
      </button>

      <button data-spread="money">
        <strong>Денежный путь</strong>
        <span>Про деньги, работу, возможности и осторожные шаги.</span>
      </button>

      <button data-spread="deep">
        <strong>Глубокий расклад</strong>
        <span>Более подробный взгляд на личную ситуацию.</span>
      </button>
    </section>

    <p class="note">
      Расклады носят развлекательный и рефлексивный характер. Не заменяют советы специалистов.
    </p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#08030f");
      tg.setBackgroundColor("#08030f");
    }

    document.querySelectorAll("button[data-spread]").forEach((button) => {
      button.addEventListener("click", () => {
        const payload = {
          action: "select_spread",
          spread: button.dataset.spread
        };

        if (tg) {
          tg.sendData(JSON.stringify(payload));
        } else {
          alert("Откройте Mini App внутри Telegram.");
        }
      });
    });
  </script>
</body>
</html>
